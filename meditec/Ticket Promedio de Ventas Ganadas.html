<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Widget Ticket Promedio</title>
    <link rel="stylesheet" type="text/css" href="//fonts.googleapis.com/css?family=Open+Sans:400,300&subset=latin,cyrillic-ext">
    <link rel="stylesheet" type="text/css" href='//fonts.googleapis.com/css?family=PT+Sans:400,700&subset=latin,cyrillic-ext'>
    <style type="text/css">
        * { box-sizing: border-box; text-rendering: geometricPrecision; -webkit-font-smoothing: antialiased; }
        :root {
            color-scheme: light dark;
            --widget-text: #2E3640;
            --widget-green: #41cfc4;
            --widget-red: #fe6e6e;
            --widget-border: rgba(46, 56, 64, 0.15);
            --widget-track: rgba(46, 56, 64, 0.10);
            --widget-muted: rgba(46, 56, 64, 0.55);
        }
        :root[data-theme="dark"] {
            --widget-text: #e8ebef;
            --widget-green: #3fdbd0;
            --widget-red: #ff8f8f;
            --widget-border: rgba(232, 235, 239, 0.25);
            --widget-track: rgba(232, 235, 239, 0.15);
            --widget-muted: rgba(232, 235, 239, 0.55);
        }
        html, body { padding: 0; margin: 0; font-family: 'PT Sans'; color: var(--widget-text); background: transparent; }
        .k-head { padding: 14px 14px 8px 14px; }
        .k-title { margin: 0 0 10px 0; font-size: 15px; font-weight: bold; }
        .k-big-value { font-size: 42px; font-weight: bold; line-height: 1.1; color: var(--widget-green); white-space: nowrap; }
        .k-big-value.red { color: var(--widget-red); }
        .k-sub { font-size: 15px; margin-top: 6px; color: var(--widget-muted); }
        .k-period { font-size: 11px; color: var(--widget-muted); margin-top: 4px; }
        .k-list { border-top: 1px solid var(--widget-border); padding: 8px 14px 10px 14px; max-height: 230px; overflow-y: auto; }
        .k-item { padding: 5px 0 7px 0; }
        .k-item-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12.5px; }
        .k-item-title { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
        .k-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
        .k-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .k-item-counts { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
        .k-value { font-weight: bold; }
        .k-sub2 { color: var(--widget-muted); font-size: 11.5px; }
        .k-bar { margin-top: 4px; height: 4px; border-radius: 2px; background: var(--widget-track); overflow: hidden; }
        .k-bar-fill { height: 100%; width: 0; border-radius: 2px; transition: width 0.6s ease; }
    </style>
    <script>
        // Detecta el tema de Kommo: param ?theme=dark/light o el del sistema
        (function () {
            function applyTheme() {
                const params = new URLSearchParams(window.location.search);
                const fromUrl = params.get('theme') || params.get('kommo_theme');
                let theme;
                if (fromUrl === 'dark' || fromUrl === 'light') {
                    theme = fromUrl;
                } else {
                    theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', theme);
            }
            applyTheme();
            if (window.matchMedia) {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
            }
        })();
    </script>
</head>
<body>
    <div class="k-head">
        <h4 class="k-title">Ticket Promedio</h4>
        <div class="k-big-value" id="big-data">Cargando...</div>
        <div class="k-sub" id="sub-data">--</div>
        <div class="k-period" id="period-data"></div>
    </div>
    <div class="k-list" id="users-list"></div>

    <script>
        // ⚠️ IMPORTANTE: Reemplaza esto con la URL de PRODUCCIÓN de tu Webhook en n8n
        const N8N_WEBHOOK_URL = 'https://flow.unyxsolutions.com/webhook/kommo-widget-ticket-promedio';

        const USER_NAMES = {
            '11370947': 'Scarlet Espinoza',
            '11371087': 'Jessica Esparza',
            '11376707': 'Daniela Ramirez',
            '12394127': 'Daysi Vera',
            '12599488': 'Jonathan Gómez',
            '14211776': 'Marco Diaz',
            '15567535': 'Jhonston Benjumea',
            '15641264': 'Javier Mata',
            '15711252': 'Tamara Thomas',
            '15768396': 'John Ponce'
        };

        const USER_COLORS = ['#41cfc4', '#5b8def', '#a97df0', '#f2a35c', '#e372b8', '#62c38f', '#ee7f7f', '#4cc0e4', '#b8ab6a', '#94a3b8'];
        const USER_COLOR = {};
        Object.keys(USER_NAMES).forEach((id, i) => { USER_COLOR[id] = USER_COLORS[i % USER_COLORS.length]; });

        function parseDate(value) {
            if (!value || value === 'false') return null;
            const m = String(value).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
            if (m) return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
            if (/^\d+$/.test(value)) {
                const n = Number(value);
                return new Date(n < 1e12 ? n * 1000 : n);
            }
            const d = new Date(value);
            return isNaN(d.getTime()) ? null : d;
        }

        function buildRequest() {
            const params = new URLSearchParams(window.location.search);
            const period = params.get('period') || '';
            const now = new Date();

            const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
            const endOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59, 999);

            const dateFrom = parseDate(params.get('date_from'));
            const dateTo = parseDate(params.get('date_to'));

            let from = 0;
            let to = now.getTime();

            if (period === 'custom' && dateFrom) {
                from = startOfDay(dateFrom).getTime();
                if (dateTo) to = endOfDay(dateTo).getTime();
            } else if (period === 'today') {
                from = startOfDay(now).getTime();
                to = endOfDay(now).getTime();
            } else if (period === 'yesterday') {
                const y = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
                from = startOfDay(y).getTime();
                to = endOfDay(y).getTime();
            } else if (period === 'week') {
                const d = startOfDay(now);
                d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
                from = d.getTime();
            } else if (period === 'month') {
                from = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
            }

            const hasPeriod = !!period || !!(dateFrom || dateTo);

            const qs = new URLSearchParams();
            qs.set('from', Math.floor(from / 1000));
            qs.set('to', Math.floor(to / 1000));
            return {
                url: N8N_WEBHOOK_URL + '?' + qs.toString(),
                fromDate: new Date(from),
                toDate: new Date(to),
                hasPeriod: hasPeriod
            };
        }

        function fmtDate(d) {
            const p = (n) => String(n).padStart(2, '0');
            return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear();
        }

        function setPeriodCaption(req) {
            const el = document.getElementById('period-data');
            if (!el) return;
            if (!req.hasPeriod) { el.innerText = ''; return; }
            const fromS = fmtDate(req.fromDate);
            const toS = fmtDate(req.toDate);
            el.innerText = fromS === toS ? fromS : fromS + ' - ' + toS;
        }

        function fitBigText() {
            const el = document.getElementById('big-data');
            const head = document.querySelector('.k-head');
            if (!el || !head) return;
            const maxW = head.clientWidth - 28;
            let size = 42;
            el.style.fontSize = size + 'px';
            while (size > 20 && el.scrollWidth > maxW) {
                size -= 2;
                el.style.fontSize = size + 'px';
            }
        }

        let resizeTimer = null;
        window.addEventListener('resize', function () {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(fitBigText, 150);
        });

        function renderUsers(perUser) {
            const container = document.getElementById('users-list');
            if (!container) return;
            const rows = (perUser || []).filter(u => USER_NAMES[String(u.user_id)]);
            if (!rows.length) { container.innerHTML = ''; return; }
            const maxAvg = Math.max(...rows.map(u => u.raw_avg || 0));
            container.innerHTML = rows.map(u => {
                const name = USER_NAMES[String(u.user_id)];
                const color = USER_COLOR[String(u.user_id)] || '#41cfc4';
                const pct = maxAvg > 0 ? Math.round(((u.raw_avg || 0) / maxAvg) * 100) : 0;
                const sub = u.text_sub ? '<span class="k-sub2">' + u.text_sub + '</span>' : '';
                return '<div class="k-item">'
                    + '<div class="k-item-head">'
                    + '<div class="k-item-title"><span class="k-dot" style="background:' + color + '"></span><span class="k-name">' + name + '</span></div>'
                    + '<div class="k-item-counts"><span class="k-value">' + u.text_main + '</span>' + sub + '</div>'
                    + '</div>'
                    + '<div class="k-bar"><div class="k-bar-fill" style="background:' + color + '" data-width="' + pct + '%"></div></div>'
                    + '</div>';
            }).join('');
            requestAnimationFrame(() => requestAnimationFrame(() => {
                container.querySelectorAll('.k-bar-fill').forEach(el => {
                    el.style.width = el.dataset.width;
                });
            }));
        }

        async function fetchData() {
            try {
                const req = buildRequest();
                const response = await fetch(req.url);
                let data = await response.json();
                if (Array.isArray(data)) data = data.length ? data[0] : {};

                document.getElementById('big-data').innerText = data.text_main || '$0,00';

                document.getElementById('sub-data').innerText = data.text_sub || '0 ventas ganadas';
                setPeriodCaption(req);
                renderUsers(data.per_user);

                requestAnimationFrame(() => requestAnimationFrame(fitBigText));
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('big-data').innerText = 'Error';
            }
        }
        fetchData();
        setInterval(fetchData, 300000); // Actualiza cada 5 min
    </script>
</body>
</html>
