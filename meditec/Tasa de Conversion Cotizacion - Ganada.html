<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Widget Conversión Cotización</title>
    <link rel="stylesheet" type="text/css" href="//fonts.googleapis.com/css?family=Open+Sans:400,300&subset=latin,cyrillic-ext">
    <link rel="stylesheet" type="text/css" href='//fonts.googleapis.com/css?family=PT+Sans:400,700&subset=latin,cyrillic-ext'>
    <style type="text/css">
        * { box-sizing: border-box; text-rendering: geometricPrecision; -webkit-font-smoothing: antialiased; }
        :root {
            color-scheme: light dark;
            --widget-text: #2E3640;
            --widget-green: #41cfc4;
            --widget-red: #fe6e6e;
        }
        :root[data-theme="dark"] {
            --widget-text: #e8ebef;
            --widget-green: #3fdbd0;
            --widget-red: #ff8f8f;
        }
        html, body { padding: 0; margin: 0; font-family: 'PT Sans'; color: var(--widget-text); background: transparent; }
        a, a:active, a:hover, a:visited { color: var(--widget-text); text-decoration: none; }
        .cell-wrapper { padding: 20px 15px 15px 15px; }
        .cell-wrapper__caption { font-size: 15px; font-weight: bold; }
        .cell-wrapper__data { height: 50px; }
        .cell-wrapper__data__num { font-size: 40px; line-height: 68px; font-family: 'Open Sans', sans-serif; }
        .cell-wrapper__bottom { margin-top: 15px; font-size: 18px; font-family: 'Open Sans', sans-serif; }
        .cell-wrapper__bottom.red, .cell-wrapper__bottom.red a { color: var(--widget-red); }
        .cell-wrapper__bottom.green, .cell-wrapper__bottom.green a { color: var(--widget-green); }
    </style>
    <script>
        // Detecta el tema de Kommo: param ?theme=dark/light o el del sistema
        (function () {
            function applyTheme() {
                const params = new URLSearchParams(window.location.search);
                const fromUrl = params.get('theme') || params.get('kommo_theme');
                let theme;
                if (fromUrl === 'dark' || fromUrl === 'light') {
                    theme = fromUrl;
                } else {
                    theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', theme);
            }
            applyTheme();
            if (window.matchMedia) {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
            }
        })();
    </script>
</head>
<body>
    <div class="cell-wrapper">
        <div class="cell-wrapper__caption">Conversión Cotización</div>
        <div class="cell-wrapper__data">
            <div class="cell-wrapper__data__num" id="main-data">Cargando...</div>
        </div>
        <div class="cell-wrapper__bottom green" id="sub-data">
            <a href="#">--%</a>
        </div>
    </div>

    <script>
        // ⚠️ IMPORTANTE: Reemplaza esto con la URL de PRODUCCIÓN de tu Webhook en n8n
        const N8N_WEBHOOK_URL = 'https://flow.unyxsolutions.com/webhook/kommo-widget-conversion';

        function parseDate(value) {
            if (!value || value === 'false') return null;
            const m = String(value).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
            if (m) return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
            if (/^\d+$/.test(value)) {
                const n = Number(value);
                return new Date(n < 1e12 ? n * 1000 : n);
            }
            const d = new Date(value);
            return isNaN(d.getTime()) ? null : d;
        }

        function buildWebhookUrl() {
            const params = new URLSearchParams(window.location.search);
            const period = params.get('period') || '';
            const now = new Date();

            const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
            const endOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59, 999);

            const dateFrom = parseDate(params.get('date_from'));
            const dateTo = parseDate(params.get('date_to'));

            let from = 0;
            let to = now.getTime();

            if (period === 'custom' && dateFrom) {
                from = startOfDay(dateFrom).getTime();
                if (dateTo) to = endOfDay(dateTo).getTime();
            } else if (period === 'today') {
                from = startOfDay(now).getTime();
                to = endOfDay(now).getTime();
            } else if (period === 'yesterday') {
                const y = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
                from = startOfDay(y).getTime();
                to = endOfDay(y).getTime();
            } else if (period === 'week') {
                const d = startOfDay(now);
                d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
                from = d.getTime();
            } else if (period === 'month') {
                from = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
            }

            const qs = new URLSearchParams();
            qs.set('from', Math.floor(from / 1000));
            qs.set('to', Math.floor(to / 1000));
            return N8N_WEBHOOK_URL + '?' + qs.toString();
        }

        async function fetchData() {
            try {
                const response = await fetch(buildWebhookUrl());
                const data = await response.json();

                document.getElementById('main-data').innerText = data.text_main;
                
                const subDataElement = document.getElementById('sub-data');
                subDataElement.querySelector('a').innerText = data.text_sub;

                if (parseFloat(data.text_sub) < 50) {
                    subDataElement.classList.remove('green');
                    subDataElement.classList.add('red');
                } else {
                    subDataElement.classList.remove('red');
                    subDataElement.classList.add('green');
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('main-data').innerText = 'Error';
            }
        }
        fetchData();
        setInterval(fetchData, 300000); // Actualiza cada 5 min
    </script>
</body>
</html>
