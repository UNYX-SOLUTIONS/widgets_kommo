# =========================================================
# nginx - Servidor estático de widgets Kommo
# Los widgets se sirven por URL directa, por ejemplo:
#   https://widgets.unyxsolutions.com/lead_cotizacion_ganada/lead_cotizacion_ganada_widget.html
# =========================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # Healthcheck para Docker / Traefik
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    # Los widgets se actualizan con frecuencia: no cachear HTML ni JSON
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
        add_header Expires 0;
        try_files $uri =404;
    }

    # Estáticos con cache ligera
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer;
        try_files $uri $uri/ =404;
    }
}
