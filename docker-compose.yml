services:
  # =========================================================
  # WIDGETS KOMMO
  # nginx que sirve los widgets HTML de Kommo
  # HTTPS lo termina Traefik (igual que unyx-workspace-enterprise)
  # =========================================================
  widgets:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: unyx-widgets
    restart: unless-stopped

    networks:
      - widgets-front

    ports:
      - "127.0.0.1:${WIDGETS_HTTP_PORT:-8081}:80"

    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.unyx-widgets.rule=Host(`${WIDGETS_DOMAIN:-widgets.unyxsolutions.com}`)"
      - "traefik.http.routers.unyx-widgets.entrypoints=websecure"
      - "traefik.http.routers.unyx-widgets.tls=true"
      - "traefik.http.routers.unyx-widgets.tls.certresolver=letsencrypt"

      - "traefik.http.services.unyx-widgets.loadbalancer.server.port=80"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =========================================================
  # UNYX · Verificar Cliente - backend
  # Node sin dependencias: OAuth de Kommo, consulta de contactos
  # y leads, y creación con revalidación anti-duplicados.
  # Es el único lugar donde vive el Secret key de la integración.
  # =========================================================
  widget-api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: unyx-widgets-api
    restart: unless-stopped

    env_file:
      - path: ./backend/.env
        required: false
      - path: ./backend/.env.production
        required: false

    environment:
      NODE_ENV: ${NODE_ENV:-production}
      TOKEN_FILE: /app/data/tokens.json

    volumes:
      - widgets-api-data:/app/data

    networks:
      - widgets-front

    ports:
      - "127.0.0.1:${WIDGETS_API_HTTP_PORT:-8082}:3000"

    labels:
      - "traefik.enable=true"

      # La API vive en su propio subdominio; nginx nunca la ve.
      - "traefik.http.routers.unyx-widgets-api.rule=Host(`${WIDGETS_API_DOMAIN:-api.widgets.unyxsolutions.com}`)"
      - "traefik.http.routers.unyx-widgets-api.entrypoints=websecure"
      - "traefik.http.routers.unyx-widgets-api.tls=true"
      - "traefik.http.routers.unyx-widgets-api.tls.certresolver=letsencrypt"

      - "traefik.http.services.unyx-widgets-api.loadbalancer.server.port=3000"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  widgets-api-data:

# =========================================================
# NETWORKS
# Red externa compartida con Traefik (la crea deploy.sh)
# =========================================================
networks:
  widgets-front:
    name: ${TRAEFIK_NETWORK:-unyx-widgets-front}
    external: true
